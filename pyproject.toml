[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerlab"
version = "0.1.0"
description = "An open-source accounting environment for building and evaluating AI accounting agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "DTZ", # naive datetimes (accounting timestamps must be timezone-aware)
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
# Warnings are errors: e.g. SQLAlchemy warns when Decimal values would be
# silently converted to float, which must never pass unnoticed here.
filterwarnings = ["error"]
