# Configuration for the `alembic` command line. Code paths (tests, init_db) build
# the equivalent configuration with ledgerlab.db.alembic_config().

[alembic]
# Migrations ship inside the package so an installed LedgerLab can create databases.
script_location = ledgerlab:migrations
path_separator = os

# sqlalchemy.url is intentionally unset: env.py reads LEDGERLAB_DATABASE_URL and
# falls back to sqlite:///ledgerlab.db.

[post_write_hooks]
# Keep generated migrations lint-clean and formatted.
hooks = ruff_format, ruff_fix
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
